<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080b10">

  <title>Zombie Survival 🧟</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game">

  <header class="topbar">

    <div>
      <h1>🧟 Zombie Survival</h1>
      <p>زنده بمان!</p>
    </div>

    <div class="stats">
      <div>❤️ <strong id="health">100</strong></div>
      <div>🔫 <strong id="ammo">30</strong></div>
      <div>🏆 <strong id="score">0</strong></div>
      <div>🌊 موج <strong id="wave">1</strong></div>
    </div>

  </header>


  <section class="game-area">

    <canvas
      id="game"
      width="900"
      height="600"
    ></canvas>


    <div id="message" class="message">

      <div class="card">

        <div class="logo">🧟</div>

        <h2 id="messageTitle">
          Zombie Survival
        </h2>

        <p id="messageText">
          آماده‌ای برای زنده ماندن؟
        </p>

        <button id="startBtn">
          🎮 شروع بازی
        </button>

      </div>

    </div>

  </section>


  <!-- کنترل موبایل -->

  <div class="mobile-controls">

    <div class="movement">

      <button data-key="up">⬆️</button>

      <div>
        <button data-key="left">⬅️</button>
        <button data-key="down">⬇️</button>
        <button data-key="right">➡️</button>
      </div>

    </div>


    <button
      id="fireBtn"
      class="fire"
    >
      🔥
    </button>

  </div>


  <footer>
    کامپیوتر: WASD + موس | موبایل: دکمه‌های حرکت + شلیک
  </footer>

</main>

<script src="script.js"></script>

</body>
</html>
